name: susiana

services:
  susiana-webui:
    build:
      context: .
      dockerfile: dockerfile
    image: pc-armin/susiana:webui
    container_name: susiana-webui
    restart: "no"
    ports:
      - "${SUSIANA_WEBUI_PORT:-5178}:80"
    environment:
      API_HOST: susiana-api
      API_PORT: "8080"
    networks:
      - app_net

networks:
  app_net:
    name: ${DOCKER_NETWORK:-susiana-net}
    external: true
